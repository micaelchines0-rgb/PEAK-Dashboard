name: Publish PEAK Desktop Update
on:
  push:
    branches: [feature/operator-login]
    paths:
      - '.github/workflows/publish-desktop-update.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: peak-desktop-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - run: npm install
      - name: Generate Windows icon
        shell: pwsh
        run: |
          python -m pip install Pillow
          @'
          from PIL import Image, ImageDraw
          from pathlib import Path
          target = Path('src-tauri/icons/icon.ico')
          target.parent.mkdir(parents=True, exist_ok=True)
          im = Image.new('RGBA', (256, 256), '#071322')
          d = ImageDraw.Draw(im)
          d.rounded_rectangle((12, 12, 244, 244), radius=52, fill='#1677f2')
          d.line([(55, 174), (108, 83), (143, 143), (169, 107), (205, 174)], fill='white', width=17, joint='curve')
          im.save(target, format='ICO', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | python -
      - run: npm run build
      - run: npm run tauri build -- --bundles nsis
      - name: Prepare release and checksum
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($version -ne '11.2.0') { throw "Unexpected version: $version" }
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer missing' }
          New-Item -ItemType Directory -Force release | Out-Null
          $name = "PEAK-Dashboard-$version-Windows-Setup.exe"
          Copy-Item $installer.FullName "release/$name"
          $hash = (Get-FileHash "release/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "release/$name.sha256" -Value "$hash  $name" -NoNewline
      - name: Publish official GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $tag = "v$version"
          if (gh release view $tag --repo "${{ github.repository }}" 2>$null) {
            throw "Release $tag already exists; refusing to overwrite"
          }
          gh release create $tag release/*.exe release/*.sha256 --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "PEAK Dashboard $version" --notes "Atualização oficial do PEAK Dashboard Windows. Login obrigatório para operadores, sincronização com PEAK ADMIN, comissões e bloqueio por fechamento. O instalador verifica integridade por SHA-256." --latest
