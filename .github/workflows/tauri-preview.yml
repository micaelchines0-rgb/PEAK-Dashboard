name: Test PEAK Tauri migration

on:
  push:
    branches:
      - migration/react-tauri
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Prepare PEAK icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/icons
          Copy-Item ../PEAK.ico src-tauri/icons/icon.ico
      - name: Install JavaScript dependencies
        run: npm install
      - name: Build Windows NSIS installer
        run: npm run tauri build -- --bundles nsis
      - name: Upload test installer
        uses: actions/upload-artifact@v4
        with:
          name: PEAK-Tauri-Preview-Windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
