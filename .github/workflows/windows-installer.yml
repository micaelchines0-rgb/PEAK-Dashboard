name: Build PEAK Dashboard Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build application EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "PEAK Dashboard" --icon PEAK.ico --add-data "PEAK.ico;." --collect-all openpyxl main.py
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PEAK-Dashboard-Windows-Setup
          path: installer/PEAK_Dashboard_V10_Setup.exe
          if-no-files-found: error
      - name: Publish installer on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" installer/PEAK_Dashboard_V10_Setup.exe --title "PEAK Dashboard ${{ github.ref_name }}" --generate-notes --verify-tag
