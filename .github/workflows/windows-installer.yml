name: Build PEAK Dashboard Windows installer

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publicar v10.1.1 no GitHub Releases apos compilar?'
        type: boolean
        required: true
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build application EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "PEAK Dashboard" --icon PEAK.ico --add-data "PEAK.ico;." --collect-all openpyxl --collect-all customtkinter main.py
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
          $file = "installer/PEAK_Dashboard_V10_1_1_Setup.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  PEAK_Dashboard_V10_1_1_Setup.exe" | Set-Content -Encoding ascii "$file.sha256"
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PEAK-Dashboard-Windows-Setup
          path: |
            installer/PEAK_Dashboard_V10_1_1_Setup.exe
            installer/PEAK_Dashboard_V10_1_1_Setup.exe.sha256
          if-no-files-found: error
      - name: Publish official v10.1.1 release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v10.1.1 "installer/PEAK_Dashboard_V10_1_1_Setup.exe" "installer/PEAK_Dashboard_V10_1_1_Setup.exe.sha256" --target "${{ github.sha }}" --title "PEAK Dashboard v10.1.1" --notes "Nova interface PEAK com botoes e cartoes arredondados, cores Midnight Black e redimensionamento do Bloco de Notas. Instalador Windows com verificacao SHA-256." --latest
