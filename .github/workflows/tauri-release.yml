name: Publish PEAK Dashboard V11 Windows

on:
  push:
    tags:
      - 'v11.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão para publicar (ex: 11.0.1)'
        required: true
        default: '11.0.1'
        type: string

permissions:
  contents: write

jobs:
  release-windows:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v11.'))
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Prepare PEAK icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/icons
          Copy-Item ../PEAK.ico src-tauri/icons/icon.ico
      - name: Install JavaScript dependencies
        run: npm install
      - name: Verify version matches tag
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $requested = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.version }}" } else { "${{ github.ref_name }}".TrimStart("v") }
          if ($version -ne $requested) { throw "Tauri version $version differs from release $requested" }
          if ($requested -notmatch '^11\\.\\d+\\.\\d+
      - name: Build Windows NSIS installer
        run: npm run tauri build -- --bundles nsis
      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Out-File -FilePath "$($_.FullName).sha256" -Encoding ascii
          }
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "v${{ inputs.version }}" } else { "${{ github.ref_name }}" }
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            git tag $tag
            git push origin $tag
            if ($LASTEXITCODE -ne 0) { throw "Failed to create release tag" }
          }
          $assets = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe, src-tauri/target/release/bundle/nsis/*.sha256 | ForEach-Object { $_.FullName })
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --title "PEAK Dashboard $tag" --generate-notes --verify-tag
          }
) { throw "Invalid V11 version" }
      - name: Build Windows NSIS installer
        run: npm run tauri build -- --bundles nsis
      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Out-File -FilePath "$($_.FullName).sha256" -Encoding ascii
          }
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $assets = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe, src-tauri/target/release/bundle/nsis/*.sha256 | ForEach-Object { $_.FullName })
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --title "PEAK Dashboard $tag" --generate-notes --verify-tag
          }
