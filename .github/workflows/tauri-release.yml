name: Publish PEAK Dashboard V11 Windows

on:
  push:
    tags:
      - 'v11.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v11.')
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Prepare PEAK icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/icons
          Copy-Item ../PEAK.ico src-tauri/icons/icon.ico
      - name: Install JavaScript dependencies
        run: npm install
      - name: Verify version matches tag
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag and Tauri version differ" }
      - name: Build Windows NSIS installer
        run: npm run tauri build -- --bundles nsis
      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Out-File -FilePath "$($_.FullName).sha256" -Encoding ascii
          }
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" src-tauri/target/release/bundle/nsis/*.exe src-tauri/target/release/bundle/nsis/*.sha256 --title "PEAK Dashboard ${{ github.ref_name }}" --generate-notes --verify-tag
