name: Publish PEAK Dashboard V11 Windows

on:
  push:
    branches: [main]
    paths:
      - 'desktop/src-tauri/tauri.conf.json'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versao a publicar (ex: 11.0.1)'
        required: true
        default: '11.3.4'
        type: string

permissions:
  contents: write

jobs:
  release-windows:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Prepare PEAK icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/icons
          Copy-Item ../PEAK.ico src-tauri/icons/icon.ico
      - name: Install JavaScript dependencies
        run: npm install
      - name: Verify release version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($env:RELEASE_VERSION -and $version -ne $env:RELEASE_VERSION) { throw "Configured version differs from requested release" }
          if (-not $version.StartsWith('11.')) { throw "Only V11 releases supported" }
      # Cliente leve: o WhatsApp funciona no servidor PEAK separado.
      - name: Build Windows NSIS installer
        run: npm run tauri build -- --bundles nsis
      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Out-File -FilePath "$($_.FullName).sha256" -Encoding ascii
          }
      - name: Publish installer in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: pwsh
        run: |
          if (-not $env:RELEASE_VERSION) { $env:RELEASE_VERSION = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version }
          $tag = "v$env:RELEASE_VERSION"
          $assets = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe, src-tauri/target/release/bundle/nsis/*.sha256 | ForEach-Object { $_.FullName })
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            git tag $tag
            git push origin $tag
            if ($LASTEXITCODE -ne 0) { throw "Failed to push release tag" }
            gh release create $tag @assets --title "PEAK Dashboard $tag" --generate-notes --verify-tag
          }
