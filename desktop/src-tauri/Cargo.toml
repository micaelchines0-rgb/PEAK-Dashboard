[package]
name = "peak_dashboard"
version = "11.0.0"
edition = "2021"

[lib]
name = "peak_dashboard_lib"
crate-type = ["staticlib","cdylib","rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
dirs = "6"
open = "5"
